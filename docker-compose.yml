services:
  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    build:
      context: ./services/clickhouse
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      IP_GEOLOCATION_DB_PATH: ${IP_GEOLOCATION_DB_PATH:-}
      DEBUG_MODE: ${DEBUG_MODE:-false}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      SMTP_MOCK: ${SMTP_MOCK:-true}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ONLY_AUTH: ${OIDC_ONLY_AUTH:-false}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CLICKHOUSE_HOST: http://clickhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      IS_PRIMARY_NODE: "true"
    expose:
      - "5005"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:5005/ping || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      API_ORIGIN: http://api:5005
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ping || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      API_UPSTREAM: api:5005
      FRONTEND_UPSTREAM: frontend:3000
    ports:
      - "8080:8080"
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  clickhouse-data:
